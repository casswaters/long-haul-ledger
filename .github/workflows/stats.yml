# Official stats pipeline — free GitHub Actions only ($0, no API keys).
# Daily: FRED graph CSV series (prices, activity, capital) and the World Bank Pink Sheet (gold, silver, copper). Weekly: World Bank WDI per country, sector shares and the OWID electricity mix.
# A failed series keeps its last good value (flagged) and is logged; files change only on new data.
name: Official stats

on:
  schedule:
    # 14:20 UTC (after US morning releases land on FRED) and 22:20 UTC (late EIA/H.10 postings)
    - cron: '20 14,22 * * *'
    # Weekly World Bank refresh, Monday 06:40 UTC (annual data; weekly is plenty)
    - cron: '40 6 * * 1'
  workflow_dispatch:
    inputs:
      worldbank:
        description: 'Also refresh World Bank indicators'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: ledger-publish
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync to latest branch tip
        # A queued or manually dispatched run checks out the SHA it was triggered on;
        # generate from the newest code/data so the commit lands cleanly on top.
        run: |
          git fetch --quiet origin "${{ github.ref_name }}"
          git reset --hard "origin/${{ github.ref_name }}"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: FRED series → data/stats/us.json
        run: node scripts/fetch-stats.mjs fred

      - name: World Bank → data/stats/world.json (weekly / manual)
        if: github.event.schedule == '40 6 * * 1' || (github.event_name == 'workflow_dispatch' && inputs.worldbank)
        run: node scripts/fetch-stats.mjs worldbank

      - name: Taiwan (IMF DataMapper; World Bank does not publish it) → data/stats/world.json (weekly / manual)
        if: github.event.schedule == '40 6 * * 1' || (github.event_name == 'workflow_dispatch' && inputs.worldbank)
        continue-on-error: true
        run: node scripts/fetch-stats.mjs imf

      - name: World Bank sector shares → data/stats/sectors.json (weekly / manual)
        if: github.event.schedule == '40 6 * * 1' || (github.event_name == 'workflow_dispatch' && inputs.worldbank)
        continue-on-error: true
        run: node scripts/fetch-stats.mjs sectors

      - name: Electricity mix (Our World in Data) → data/stats/energy-mix.json (weekly / manual)
        if: github.event.schedule == '40 6 * * 1' || (github.event_name == 'workflow_dispatch' && inputs.worldbank)
        continue-on-error: true
        run: node scripts/fetch-stats.mjs energymix

      - name: US states (BEA, Census, BLS via FRED, EIA) → data/stats/us-states.json (weekly / manual; skipped without repository secrets)
        if: github.event.schedule == '40 6 * * 1' || (github.event_name == 'workflow_dispatch' && inputs.worldbank)
        continue-on-error: true
        env:
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: node scripts/fetch-us-states.mjs

      - name: World Bank Pink Sheet → data/stats/benchmarks.json (gold, silver, copper; monthly)
        continue-on-error: true
        run: node scripts/fetch-stats.mjs pinksheet

      - name: Coverage counts → data/coverage.json (Method page line)
        continue-on-error: true
        run: node scripts/build-coverage.mjs

      - name: Tests
        run: npm test

      - name: Commit data on top of latest main (retries; never conflicts)
        id: commit
        run: |
          scripts/commit-data.sh "chore: refresh official stats ($(date -u +%Y-%m-%dT%H:%MZ))" data/stats data/coverage.json

      - name: Deploy Pages (gh-pages)
        if: github.ref == 'refs/heads/main' && (steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          force_orphan: false
          exclude_assets: '.github,node_modules,scripts,.gitignore,.gitattributes,package-lock.json,shots.mjs,qa-retone.mjs,ledger.test.js,stats.test.mjs,location.test.mjs,energy.test.mjs,economy.test.mjs,signup.test.mjs,reorient.test.mjs,phase0.test.mjs,phase1.test.mjs,phase1b.test.mjs,archive.html,data/monday-haul,hauls,BUILD-PLAN.md,RESEARCH-RUNS.md,BRIEF.md,ROADMAP.md,data/news-cache'
          commit_message: 'Deploy official stats'
