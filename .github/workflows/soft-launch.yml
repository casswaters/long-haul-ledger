# News feed (public RSS + GDELT DOC API, location-tagged) + Prices public series — GitHub Actions only, no API keys.
name: Soft-launch news feed

on:
  schedule:
    # Every 6 hours (UTC)
    - cron: '17 */6 * * *'
  workflow_dispatch:
  # A routine/hand edit to the curated overrides or the sector briefs publishes within minutes.
  push:
    branches: [main]
    paths: ['data/signals-curated.json', 'data/energy-briefs.json', 'data/materials-briefs.json', 'data/manufacturing-briefs.json', 'data/services-briefs.json', 'data/technology-briefs.json', 'data/policy-briefs.json']

permissions:
  contents: write

concurrency:
  group: ledger-publish
  cancel-in-progress: false

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync to latest branch tip
        # A queued or manually dispatched run checks out the SHA it was triggered on;
        # generate from the newest code/data so the commit lands cleanly on top.
        run: |
          git fetch --quiet origin "${{ github.ref_name }}"
          git reset --hard "origin/${{ github.ref_name }}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch public feeds + GDELT top-up → signals-live.json (location-tagged)
        # Feed/GDELT failures are non-fatal: the file is only written on success, so the last good data stays.
        continue-on-error: true
        run: node scripts/fetch-signals.mjs

      - name: Sector brief candidates → data/news-cache/{tab}-candidates.json (for research runs)
        # Energy plus the five sector tabs. Assembles tagged stories per place and source or segment for the writer. Nothing is written to the site.
        continue-on-error: true
        run: node scripts/build-energy-brief.mjs

      - name: Validate sector briefs, all six tabs (sources required, stale after 7 days)
        # Non-fatal: the site also validates and drops any item without sources.
        continue-on-error: true
        run: node scripts/build-energy-brief.mjs --validate

      - name: Fetch public price series → data/desks/prices.json
        # EIA diesel + Henry Hub via FRED graph CSV (no key). A failed fetch keeps
        # the last good line and its as-of date; the file only changes on new data.
        continue-on-error: true
        run: node scripts/fetch-prices.mjs

      - name: Commit data on top of latest main (retries; never conflicts)
        id: commit
        run: |
          scripts/commit-data.sh "chore: refresh news feed + Prices ($(date -u +%Y-%m-%dT%H:%MZ))" data/signals-live.json data/desks/prices.json data/news-cache

      - name: Deploy Pages (gh-pages)
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          force_orphan: false
          # Keep Actions build artifacts out of the static site
          # BUILD-PLAN.md, RESEARCH-RUNS.md and BRIEF.md stay on main only; they must never ship to Pages.
          exclude_assets: '.github,node_modules,scripts,.gitignore,package-lock.json,shots.mjs,qa-retone.mjs,ledger.test.js,stats.test.mjs,location.test.mjs,energy.test.mjs,economy.test.mjs,BUILD-PLAN.md,RESEARCH-RUNS.md,BRIEF.md,ROADMAP.md,data/news-cache'
          commit_message: 'Deploy soft-launch news feed'
