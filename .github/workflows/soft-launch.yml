# US Progress RSS ingest + Prices desk public series — free GitHub Actions only ($0, no API keys).
name: Soft-launch US Progress

on:
  schedule:
    # Every 6 hours (UTC)
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ledger-publish
  cancel-in-progress: false

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch public RSS → signals-live.json
        run: node scripts/fetch-signals.mjs

      - name: Fetch public price series → data/desks/prices.json
        # EIA diesel + Henry Hub via FRED graph CSV (no key). A failed fetch keeps
        # the last good line and its as-of date; the file only changes on new data.
        run: node scripts/fetch-prices.mjs

      - name: Detect data change
        id: diff
        run: |
          if git diff --quiet -- data/signals-live.json data/desks/prices.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit live signals
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/signals-live.json data/desks/prices.json
          git commit -m "chore: refresh US Progress signals + Prices desk ($(date -u +%Y-%m-%dT%H:%MZ))"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}

      - name: Deploy Pages (gh-pages)
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          force_orphan: false
          # Keep Actions build artifacts out of the static site
          # BUILD-PLAN.md stays on main only; it must never ship to Pages.
          exclude_assets: '.github,node_modules,scripts,.gitignore,package-lock.json,shots.mjs,qa-retone.mjs,ledger.test.js,stats.test.mjs,BUILD-PLAN.md'
          commit_message: 'Deploy soft-launch US Progress'
