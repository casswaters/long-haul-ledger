# Soft-launch US Progress RSS ingest — free GitHub Actions only ($0).
name: Soft-launch US Progress

on:
  schedule:
    # Every 6 hours (UTC)
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: soft-launch-us-progress
  cancel-in-progress: true

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch public RSS → signals-live.json
        run: node scripts/fetch-signals.mjs

      - name: Detect data change
        id: diff
        run: |
          if git diff --quiet -- data/signals-live.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit live signals
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/signals-live.json
          git commit -m "chore: refresh US Progress signals ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push origin HEAD:${{ github.ref_name }}

      - name: Deploy Pages (gh-pages)
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          force_orphan: false
          # Keep Actions build artifacts out of the static site
          exclude_assets: '.github,node_modules,scripts,.gitignore,package-lock.json,shots.mjs,ledger.test.js'
          commit_message: 'Deploy soft-launch US Progress'
